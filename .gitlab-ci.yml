# CI/CD for ufs-atlas.de
#
#   build_web   arm64 runner: build and push the website image (Caddy plus the static files)
#   deploy      (manual) docker compose over SSH to fuewa.systems (a shared host)
#
# The image build is the whole build: what goes in is finished HTML, JS and
# CSS. The data under maps/ and in gamedata.json is produced locally from the
# game installation with tools/extract.ps1 and checked in.
#
# Required CI/CD variable:
#   SSH_PRIVATE_KEY   key for root@fuewa.systems (deploy only)

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

stages:
  - build_image
  - deploy

# -- 1) Website image: Caddy with the static files -------------------
build_web:
  stage: build_image
  tags:
    - arm
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    # The imprint and the contact address belong to whoever runs the site, so
    # they come from CI/CD variables rather than from the sources. Unset means
    # the pages leave those links out.
    - docker build --provenance=false --sbom=false -f Dockerfile.web
      --build-arg VITE_IMPRINT_URL="$IMPRINT_URL"
      --build-arg VITE_OPERATOR_MAIL="$OPERATOR_MAIL"
      --build-arg VITE_SITE_URL="${SITE_URL:-https://ufs-atlas.de}"
      -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA"
      -t "$CI_REGISTRY_IMAGE/web:latest" .
    - docker push "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/web:latest"
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# -- 2) Deploy (manual): docker compose against the remote daemon ----
deploy:
  stage: deploy
  needs:
    - build_web
  variables:
    DOCKER_HOST: "ssh://root@fuewa.systems"
    WEB_IMAGE: "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA"
    # APP_SECRET, DB_PASSWORD, DB_ROOT_PASSWORD, MAILER_DSN, MAILER_FROM and
    # MAILER_FROM_HEADER come from the CI/CD variables and are in the job's
    # environment already. Listing them again here would write the literal
    # text "$NAME" into the container whenever one of them is unset.
  before_script:
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
    # ControlMaster puts every docker-over-SSH call on ONE connection.
    - printf 'Host fuewa.systems\n  User root\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking accept-new\n  ControlMaster auto\n  ControlPath ~/.ssh/cm-%%r@%%h:%%p\n  ControlPersist 120s\n  ConnectTimeout 30\n  ConnectionAttempts 3\n  ServerAliveInterval 15\n' > ~/.ssh/config
    - for i in 1 2 3 4 5 6; do ssh -o BatchMode=yes fuewa.systems true && break || (echo "ssh retry $i"; sleep 10); done
  script:
    # Better to stop here than to roll out with empty secrets
    - |
      missing=
      for v in APP_SECRET DB_PASSWORD DB_ROOT_PASSWORD MAILER_DSN; do
        eval "value=\$$v"
        case "$value" in
          "" | '$'*) missing="$missing $v" ;;
        esac
      done
      if [ -n "$missing" ]; then
        echo "These CI/CD variables are missing:$missing - see DEPLOY.md." >&2
        exit 1
      fi
    # Log in on the REMOTE daemon so it can pull the private image
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker compose -f deploy/docker-compose.yml pull
    - docker compose -f deploy/docker-compose.yml up -d --remove-orphans --wait --wait-timeout 180
  environment:
    name: production
    url: https://ufs-atlas.de
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
