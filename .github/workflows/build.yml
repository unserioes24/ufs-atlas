name: Build

# The guide has no server side in its build: TypeScript and the game data turn
# into a folder of finished files. Deploying stays with GitLab, where the
# credentials live.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check

      - name: Check the address table
        run: node scripts/route-check.mjs

      - name: Build for the server
        run: npm run build

      # The offline build is the one people download: one HTML file, one script,
      # one stylesheet and the map images. It opens from disk without a server.
      - name: Build the offline version
        run: npm run build:offline

      - name: Keep the server build
        uses: actions/upload-artifact@v4
        with:
          name: ufs-atlas-dist
          path: dist/
          retention-days: 14

      - name: Keep the offline version
        uses: actions/upload-artifact@v4
        with:
          name: ufs-atlas-offline
          path: dist-offline/
          retention-days: 14

  # A tag v1.2.3 publishes the offline version. That is what someone downloading
  # a release wants: unzip, open index.html, done. No tools, no server code.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ufs-atlas-offline
          path: offline

      # robots.txt and sitemap.xml belong to the hosted site, not to a copy on
      # someone's disk.
      - name: Pack the archive
        run: |
          rm -f offline/robots.txt offline/sitemap.xml
          cd offline && zip -r ../ufs-atlas-offline-${{ github.ref_name }}.zip .

      - uses: softprops/action-gh-release@v2
        with:
          files: ufs-atlas-offline-${{ github.ref_name }}.zip
          generate_release_notes: true
          body: |
            **Offline version** — unzip and open `index.html`. No server, no
            installation; the whole guide runs in the browser.

            Ticked species and a loaded save file stay in that browser. Accounts,
            groups and comparing profiles need the hosted version at
            https://ufs-atlas.de.
