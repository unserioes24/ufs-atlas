# Statische Dateien direkt ausliefern, alles Übrige an Symfony.
<Directory /var/www/html/public>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    DirectoryIndex index.html index.php

    RewriteEngine On
    # Vorhandene Dateien und Verzeichnisse gewinnen
    RewriteCond %{REQUEST_FILENAME} -f [OR]
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteRule ^ - [L]
    RewriteRule ^ index.php [L]
</Directory>

# Die Seite soll nicht in Suchmaschinen auftauchen
Header always set X-Robots-Tag "noindex, nofollow, noarchive, nosnippet"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"

# Aus dem Spiel extrahierte Medien ändern sich nur bei einer Neuextraktion
<LocationMatch "^/(maps|fish|models)/">
    Header always set Cache-Control "public, max-age=604800"
</LocationMatch>

ServerTokens Prod
ServerSignature Off
