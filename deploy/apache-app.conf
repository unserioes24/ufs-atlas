# Serve static files straight away, hand everything else to Symfony.
<Directory /var/www/html/public>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    DirectoryIndex index.html index.php

    RewriteEngine On
    # Existing files and directories win
    RewriteCond %{REQUEST_FILENAME} -f [OR]
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteRule ^ - [L]

    # The API belongs to Symfony
    RewriteCond %{REQUEST_URI} ^/api/
    RewriteRule ^ index.php [L]

    # Everything else is a view of the guide. Each one is a path of its own so
    # it can be indexed and bookmarked; the app reads the path and renders it.
    RewriteRule ^ index.html [L]
</Directory>

Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"

# Media extracted from the game only changes when the extraction is re-run
<LocationMatch "^/(maps|fish|models)/">
    Header always set Cache-Control "public, max-age=604800"
</LocationMatch>

ServerTokens Prod
ServerSignature Off
