# Serve static files straight away, hand everything else to Symfony.
<Directory /var/www/html/public>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    DirectoryIndex index.html index.php

    RewriteEngine On
    # Existing files and directories win
    RewriteCond %{REQUEST_FILENAME} -f [OR]
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteRule ^ - [L]
    RewriteRule ^ index.php [L]
</Directory>

# The site is meant to stay out of search engines
Header always set X-Robots-Tag "noindex, nofollow, noarchive, nosnippet"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"

# Media extracted from the game only changes when the extraction is re-run
<LocationMatch "^/(maps|fish|models)/">
    Header always set Cache-Control "public, max-age=604800"
</LocationMatch>

ServerTokens Prod
ServerSignature Off
